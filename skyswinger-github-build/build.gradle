plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.+'
}

version = '1.3.0'
group = 'com.skyswinger'
base { archivesName = 'skyswinger' }

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = '21.1.172'
    runs {
        client { client() }
    }
    mods {
        "skyswinger" { sourceSet sourceSets.main }
    }
}
