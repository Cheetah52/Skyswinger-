name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2
      - name: Find newest project folder
        id: find
        run: |
          best=""; bestt=0
          while IFS= read -r f; do
            d=$(dirname "$f")
            t=$(git log -1 --format=%ct -- "$d")
            echo "Found: $d (updated $t)"
            if [ "${t:-0}" -gt "$bestt" ]; then bestt=$t; best=$d; fi
          done < <(find . -name 'settings.gradle*' -not -path './.git/*')
          if [ -z "$best" ]; then echo "No project folder found"; exit 1; fi
          echo "Building: $best"
          echo "dir=$best" >> "$GITHUB_OUTPUT"
      - name: Build
        working-directory: ${{ steps.find.outputs.dir }}
        run: gradle build
      - uses: actions/upload-artifact@v4
        with:
          name: skyswinger-jar
          path: ${{ steps.find.outputs.dir }}/build/libs/*.jar
